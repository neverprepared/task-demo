<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Task Demo</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>Task Demo</h1>
      <p class="subtitle">A demo Node.js website</p>
    </header>

    <main>
      <section class="card">
        <h2>Welcome</h2>
        <p>This is a demo Express.js application. The server is running and serving static files.</p>
      </section>

      <section class="card">
        <h2>API Status</h2>
        <button id="checkStatus">Check Status</button>
        <pre id="statusOutput" class="output">Click the button to check API status.</pre>
      </section>
    </main>

    <footer>
      <p>neverprepared / task-demo</p>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
